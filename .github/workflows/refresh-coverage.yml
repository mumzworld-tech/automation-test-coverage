# Regenerates mapping.json from automation_web_2.0 @ main and commits the result.
#
# This project is independent of automation_web_2.0: nothing in that repo knows
# the report exists. Instead this workflow polls its main branch, and rebuilds
# only when main has moved past the commit mapping.json was built from
# (metadata.source_sha). A poll that finds nothing new stops after one API call.
#
# Setup (one time, needs admin on this repo):
#   mumzworld-tech does not accept fine-grained PATs, so use a classic PAT with
#   the `repo` scope from someone who can read mumzworld-tech/automation_web_2.0:
#     gh secret set AUTOMATION_REPO_TOKEN --repo mumzworld-tech/automation-test-coverage
#   The token is only used to read; the push back here uses the built-in token.
#
# The TestMO exports are not available to CI, so testmo_tests.json /
# app_testmo_tests.json / web_regression_tests.json stay as committed; only the
# automated-test inventory and the mapping are rebuilt. Re-run `make generate`
# locally after a fresh TestMO export. tenure.json and runs.json stay manual too
# (`make tenure`, `make runs`).
name: Refresh coverage from main

on:
  schedule:
    # The repo is private, so every run bills Actions minutes (rounded up to a
    # whole minute) against the org's Free-plan allowance. Every 30 minutes in
    # Dubai working hours (08:00-20:00, Mon-Fri) is ~550 minutes a month;
    # one run a day covers the weekend.
    - cron: '*/30 4-16 * * 1-5'
    - cron: '0 6 * * 0,6'
  workflow_dispatch:          # "Run workflow" button: rebuilds even if main has not moved

permissions:
  contents: write

concurrency:
  group: refresh-coverage
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fail clearly if the secret is missing
        run: |
          if [ -z "${{ secrets.AUTOMATION_REPO_TOKEN }}" ]; then
            echo "::error::AUTOMATION_REPO_TOKEN is not set."
            echo "Add a classic PAT (repo scope) that can read mumzworld-tech/automation_web_2.0:"
            echo "  gh secret set AUTOMATION_REPO_TOKEN --repo mumzworld-tech/automation-test-coverage"
            exit 1
          fi

      - name: Check out the report
        uses: actions/checkout@v4

      - name: Has main moved?
        id: moved
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_REPO_TOKEN }}
        run: |
          head=$(gh api repos/mumzworld-tech/automation_web_2.0/commits/main --jq .sha)
          built=$(jq -r '.metadata.source_sha // ""' mapping.json)
          echo "main is ${head:0:7}; mapping.json was built from ${built:-nothing}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${head:0:${#built}}" != "$built" ] || [ -z "$built" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new on main."
          fi

      - name: Check out the automation repo (read only)
        if: steps.moved.outputs.rebuild == 'true'
        uses: actions/checkout@v4
        with:
          repository: mumzworld-tech/automation_web_2.0
          token: ${{ secrets.AUTOMATION_REPO_TOKEN }}
          path: automation_web_2.0
          fetch-depth: 0          # extract_tests.py reads origin/main and the AR ticket history
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.moved.outputs.rebuild == 'true'
        with:
          python-version: '3.12'

      - name: Rebuild the inventory and mapping
        if: steps.moved.outputs.rebuild == 'true'
        run: |
          python3 extract_tests.py "$GITHUB_WORKSPACE/automation_web_2.0"
          python3 build_mapping.py
          python3 verify_mapping.py

      - name: Commit if anything changed
        if: steps.moved.outputs.rebuild == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automated_tests.json mapping.json
          if git diff --cached --quiet; then
            echo "No change — main moved, but not in a way the report sees."
          else
            sha=$(git -C automation_web_2.0 rev-parse --short origin/main)
            git commit -m "chore: refresh coverage from automation_web_2.0 @ $sha"
            git push
          fi
