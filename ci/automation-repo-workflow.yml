# Copy this to automation_web_2.0 as .github/workflows/publish-coverage.yml
#
# Why it lives in the automation repo rather than the coverage repo:
# the automation repo pushes to the coverage repo, so reading the tests needs
# no token at all -- the built-in GITHUB_TOKEN already has it. The only
# credential is one that can write to mumzworld-tech/automation-test-coverage.
#
# mumzworld-tech does not accept fine-grained PATs, so use either:
#   a. a deploy key (preferred -- scoped to the one repo, owned by no person).
#      Needs an admin on automation-test-coverage to add the public half:
#        ssh-keygen -t ed25519 -N '' -f coverage_key
#        gh repo deploy-key add coverage_key.pub --allow-write \
#          --repo mumzworld-tech/automation-test-coverage
#        gh secret set COVERAGE_DEPLOY_KEY < coverage_key --repo mumzworld-tech/automation_web_2.0
#      and replace `token:` below with `ssh-key: ${{ secrets.COVERAGE_DEPLOY_KEY }}`; or
#   b. a classic PAT with the `repo` scope from anyone with push access:
#        gh secret set COVERAGE_REPO_TOKEN --repo mumzworld-tech/automation_web_2.0
name: Publish coverage report

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'          # the mapping is derived from these files
      - 'pages/**'          # skip markers and locale-aware code move with them
      - 'pagesApp/**'
      - 'resources/**'
  schedule:
    - cron: '0 6 * * *'     # safety net: AR detection reads commit history, which
                            # can change without tests/ being touched
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (built-in token — no PAT needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # extract_tests.py reads origin/main and the AR ticket history

      - name: Check out the coverage report (public — no auth to read)
        uses: actions/checkout@v4
        with:
          repository: mumzworld-tech/automation-test-coverage
          token: ${{ secrets.COVERAGE_REPO_TOKEN }}
          path: coverage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the inventory and mapping
        working-directory: coverage
        run: |
          python3 extract_tests.py "$GITHUB_WORKSPACE"
          python3 build_mapping.py
          python3 verify_mapping.py

      - name: Push the refreshed report
        working-directory: coverage
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automated_tests.json mapping.json
          if git diff --cached --quiet; then
            echo "No change — the test suite did not move."
          else
            git commit -m "chore: refresh coverage from automation_web_2.0 @ ${GITHUB_SHA:0:7}"
            git push
          fi
